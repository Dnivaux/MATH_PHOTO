<?xml version="1.0" encoding="UTF-8"?>
<!-- Icône PhotoMathon, avant-plan de l'icône adaptative Android (108 x 108 dp, zone sûre : cercle de 66 dp au centre).
     Viseur d'appareil photo (photo), thon (thon), x² (math). Rendu : scripts/make-icons.sh -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <defs>
    <clipPath id="body">
      <path d="M77 55 C72 45 60 42.5 49 45 C44.5 46 41 48.5 38.5 51.5 L38.5 58.5 C41 61.5 44.5 64 49 65 C60 67.5 72 65 77 55 Z"/>
    </clipPath>
  </defs>
  <!-- viseur -->
  <g fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M29 41 V34 A3 3 0 0 1 32 31 H39"/>
    <path d="M69 31 H76 A3 3 0 0 1 79 34 V41"/>
    <path d="M79 69 V76 A3 3 0 0 1 76 79 H69"/>
    <path d="M39 79 H32 A3 3 0 0 1 29 76 V69"/>
  </g>
  <!-- nageoires jaunes (dorsale, anale, pinnules) -->
  <g fill="#FACC15">
    <path d="M51 45.5 Q56 42 63 37.5 Q60.5 41.5 62 44.5 Z"/>
    <path d="M53 64.5 Q57 67.5 63 71.5 Q60.5 68 62 65.5 Z"/>
    <path d="M44 46.5 L46 43 L47.5 46 Z"/>
    <path d="M44 63.5 L46 67 L47.5 64 Z"/>
  </g>
  <!-- queue en croissant -->
  <path d="M39.5 55 L33 44.5 Q36.5 55 33 65.5 Z" fill="#0F2A4A" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- corps : dos bleu nuit, ventre argenté -->
  <g clip-path="url(#body)">
    <rect x="30" y="40" width="50" height="30" fill="#E2E8F0"/>
    <path d="M30 40 H80 V54 C70 57 50 57 30 53 Z" fill="#0F2A4A"/>
  </g>
  <path d="M77 55 C72 45 60 42.5 49 45 C44.5 46 41 48.5 38.5 51.5 L38.5 58.5 C41 61.5 44.5 64 49 65 C60 67.5 72 65 77 55 Z"
        fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- œil -->
  <circle cx="69.5" cy="52" r="2.6" fill="#FFFFFF"/>
  <circle cx="70" cy="52" r="1.3" fill="#0F2A4A"/>
  <!-- x² sur le flanc -->
  <text x="52" y="62.3" font-family="Noto Sans, DejaVu Sans, sans-serif" font-weight="800" font-size="9.5" fill="#1A73C8">x<tspan font-size="6" dy="-4">2</tspan></text>
</svg>
