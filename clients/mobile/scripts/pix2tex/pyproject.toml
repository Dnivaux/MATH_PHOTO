[project]
name = "pix2tex-onnx"
version = "0.1.0"
description = "Export ONNX (encodeur + décodeur, INT8) de pix2tex pour l'app téléphone"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch>=2.4",
  "torchvision",
  "pix2tex==0.1.4",
  "onnx>=1.16",
  "onnxruntime>=1.19",
  "onnxscript",
  "pillow",
  "matplotlib",
  "numpy<2",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
