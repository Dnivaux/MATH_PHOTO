# Prometheus (dossier, phase 9). Une seule des deux gateways tourne selon le profil (gpu ou ci).
global:
  scrape_interval: 10s
scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["gateway:8100", "gateway-ci:8100"]
  - job_name: vllm   # tokens/s, cache KV, décodage spéculatif
    static_configs:
      - targets: ["vllm:8000"]
  - job_name: vllm-canary   # challenger du canary
    static_configs:
      - targets: ["vllm-canary:8000"]
  - job_name: explainer   # llama-server lancé avec --metrics
    static_configs:
      - targets: ["explainer:8000"]
