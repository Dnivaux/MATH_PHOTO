apiVersion: 1
datasources:
  - name: Prometheus
    uid: prom
    type: prometheus
    url: http://prometheus:9090
    isDefault: true
  - name: Gateway (usage)
    uid: pg
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: mlflow
    jsonData:
      database: gateway
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
