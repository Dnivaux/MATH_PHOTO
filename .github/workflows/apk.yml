# APK Android (dossier, phase 8 : « CI des clients : build de l'APK, publication en release »).
# Lancé à la main (onglet Actions) ou par un tag v* ; un tag publie l'APK dans une release GitHub.
# Le modèle d'explication n'est pas dans l'APK : l'app le télécharge depuis la gateway (GET /v1/models).
name: apk

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write   # publication de la release sur un tag

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: clients/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: clients/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      - name: Lecteurs OCR pix2text-mfr v1 et 1.5 (poids publics, révisions figées), export INT8
        run: >-
          uv run --no-project --python 3.12
          --with onnx==1.23.2 --with onnxruntime==1.31.1 --with huggingface_hub==0.36.2
          --with numpy==2.5.4 --with pillow==13.0.0
          python clients/mobile/scripts/p2t_mfr/export.py --n 0
        working-directory: .
      - run: npm run engine-assets
      - name: Gradle
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
        working-directory: clients/mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: photo-maths-apk
          path: clients/mobile/android/app/build/outputs/apk/release/app-release.apk
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "photo-maths-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "photo-maths-${GITHUB_REF_NAME}.apk" --generate-notes
