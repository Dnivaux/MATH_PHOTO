# Stack Photo → Maths (dossier, phase 4 : niveau 0 « lancement en une commande »).
#
#   docker compose up -d --build                  infra seule : MLflow + Postgres + MinIO (entraînement, évals)
#   docker compose --profile gpu up -d --build    + vLLM (teacher-ft) + explicateur GGUF + gateway  (make up)
#   docker compose --profile ci up -d --build     + faux LLM à la place des modèles, sans GPU      (make up-ci)
#
# Les modèles servis sont les `champion` du registry MLflow, téléchargés par `model-fetch` au démarrage.
# UI MLflow : http://localhost:5000   Console MinIO : http://localhost:9001   Gateway : http://localhost:8100
# Grafana : http://localhost:3000 (admin / GRAFANA_ADMIN_PASSWORD)   Prometheus : http://localhost:9090
name: photo-maths

x-gateway: &gateway
  # Partie commune des deux gateways (une par profil : les dépendances diffèrent)
  build: {context: ., dockerfile: serving/gateway/Dockerfile}
  environment: &gateway-env
    VLLM_BASE_URL: http://vllm:8000/v1
    VLLM_MODEL: teacher-ft
    EXPLAIN_BASE_URL: http://explainer:8000/v1
    EXPLAIN_MODEL: explainer
    MLFLOW_TRACKING_URI: http://mlflow:5000
    GATEWAY_TOKENS: ${GATEWAY_TOKENS:-dev-token}
    # modèle d'explication distribué aux clients et servi en mode léger (le même)
    MODEL_ROLES: '{"android/explainer": "${EXPLAINER_REGISTRY:-explainer-0.6b-p20-gguf}", "ios/explainer": "${EXPLAINER_REGISTRY:-explainer-0.6b-p20-gguf}", "desktop/explainer": "${EXPLAINER_REGISTRY:-explainer-0.6b-p20-gguf}"}'
    GATEWAY_ADMIN_TOKEN: ${GATEWAY_ADMIN_TOKEN:-}
    GATEWAY_DB_URL: postgresql+psycopg2://mlflow:${POSTGRES_PASSWORD:-mlflow}@postgres:5432/gateway
    SANDBOX_URL: http://sandbox:8200
    SANDBOX_TOKEN: ${SANDBOX_TOKEN:-change-me}
  networks: [default, sandbox-net]
  volumes:
    - registry:/registry:ro
    - modelcache:/cache
  ports:
    - "8100:8100"
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
    interval: 10s
    retries: 30
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlflow}
      POSTGRES_DB: mlflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  minio:
    # Les images MinIO officielles (Docker Hub, quay.io) ont été retirées : build Chainguard (même binaire).
    image: chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio-secret-123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    restart: unless-stopped

  minio-init:
    # Crée les buckets avec boto3 (l'image mlflow l'embarque), en réessayant tant que MinIO démarre.
    build: ./infra/mlflow
    depends_on: [minio]
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio-secret-123}
    command:
      - python
      - -c
      - |
        import time, boto3
        s3 = boto3.client("s3", endpoint_url="http://minio:9000", region_name="us-east-1")
        for i in range(60):
            try:
                have = {b["Name"] for b in s3.list_buckets()["Buckets"]}
                break
            except Exception as e:
                print("minio pas prêt:", e); time.sleep(2)
        else:
            raise SystemExit("MinIO injoignable")
        for b in ("mlflow-artifacts", "models"):
            if b not in have:
                s3.create_bucket(Bucket=b)
        print("buckets OK")

  mlflow:
    build: ./infra/mlflow
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio-secret-123}
    # --serve-artifacts : les clients passent par MLflow, ils n'ont pas besoin des identifiants MinIO.
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql+psycopg2://mlflow:${POSTGRES_PASSWORD:-mlflow}@postgres:5432/mlflow
      --artifacts-destination s3://mlflow-artifacts
      --serve-artifacts
      --allowed-hosts "localhost,localhost:*,127.0.0.1:*,mlflow:*"
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  # ---- Service (profils gpu et ci)

  model-fetch:
    # Télécharge les `champion` du registry dans le volume `registry` (rien si la version est déjà là).
    build: ./infra/mlflow
    profiles: [gpu]
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - registry:/registry
      - ./serving/fetch_models.py:/fetch_models.py:ro
    command: ["python", "/fetch_models.py", "math-7b-teacher", "${EXPLAINER_REGISTRY:-explainer-0.6b-p20-gguf}"]

  vllm:
    # Qwen2.5-Math-7B + adaptateur QLoRA `teacher-ft` du registry (même version de vLLM que le venv).
    image: vllm/vllm-openai:v0.30.0@sha256:8a69ffad015f138d7170c4ddc429e230a3bc1c1719f67e14324749df200a4b90
    profiles: [gpu]
    depends_on:
      model-fetch:
        condition: service_completed_successfully
    command:
      - Qwen/Qwen2.5-Math-7B-Instruct
      - --served-model-name=qwen-math-7b
      - --enable-lora
      - --max-lora-rank=16
      - --lora-modules
      - teacher-ft=/registry/math-7b-teacher/model
      - --max-model-len=4096
      - --gpu-memory-utilization=${GPU_UTIL:-0.80}   # le reste : TexTeller (service ocr) et le bureau
    environment:
      HF_HUB_OFFLINE: "1"   # poids de base déjà dans le cache de l'hôte, monté en lecture seule
    volumes:
      - registry:/registry:ro
      - ${HF_HOME:-~/.cache/huggingface}:/root/.cache/huggingface:ro
    ipc: host
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 10s
      start_period: 600s
      retries: 6
    restart: unless-stopped

  explainer:
    # Mode léger (POST /v1/explain) : l'explicateur champion en GGUF sur CPU, comme sur le téléphone.
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:ba68b6996ba6d27a49a9864452194128e118a1fcb96dd663f223a13e0a2857a8
    profiles: [gpu]
    depends_on:
      model-fetch:
        condition: service_completed_successfully
    command: ["-m", "/registry/${EXPLAINER_REGISTRY:-explainer-0.6b-p20-gguf}/current.gguf", "--alias", "explainer", "--host", "0.0.0.0",
              "--port", "8000", "--jinja", "-c", "4096", "-t", "${EXPLAIN_THREADS:-8}", "--parallel", "4", "--metrics"]
    volumes:
      - registry:/registry:ro
    ports:
      - "8090:8000"
    healthcheck:  # celui de l'image vise le port 8080
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 10s
      retries: 6
    restart: unless-stopped

  ocr:
    # OCR serveur (TexTeller sur GPU, ~1 Go à côté de vLLM) : relit les photos que le téléphone a lues avec peu
    # de certitude. Sans GPU : OCR_DEVICE=cpu (et l'image peut être construite avec TORCH_INDEX=.../whl/cpu).
    build:
      context: .
      dockerfile: serving/ocr/Dockerfile
      args: {TORCH_INDEX: "${OCR_TORCH_INDEX:-https://download.pytorch.org/whl/cu132}"}
    profiles: [gpu]
    environment:
      OCR_DEVICE: ${OCR_DEVICE:-cuda}
      OCR_THREADS: ${OCR_THREADS:-4}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ${HF_HOME:-~/.cache/huggingface}:/hf:ro   # poids TexTeller déjà téléchargés par .venv-ocr
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8300/health')"]
      interval: 10s
      start_period: 120s
      retries: 6
    restart: unless-stopped

  fake-llm:
    # Profil ci : oracle compatible OpenAI, joignable sous les noms `vllm` et `explainer`.
    build: {context: ., dockerfile: serving/gateway/Dockerfile}
    profiles: [ci]
    command: ["uvicorn", "serving.llm.fake_llm:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./data:/app/data:ro
    networks:
      default:
        aliases: [vllm, explainer]

  sandbox:
    # Exécution du code généré (dossier, phase 5). Réseau interne seulement : ni Internet, ni Postgres, ni MLflow.
    build: {context: ., dockerfile: serving/gateway/Dockerfile}
    profiles: [gpu, ci]
    command: ["uvicorn", "serving.sandbox.service:app", "--host", "0.0.0.0", "--port", "8200"]
    environment:
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-change-me}
    networks: [sandbox-net]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # test de charge (eval/load_test.py) : à 2 cœurs, le bac à sable plafonnait la stack à ~6 req/s (un Python +
    # SymPy par exécution) ; à 8, le GPU redevient la limite. Surchargeable : SANDBOX_CPUS dans .env
    pids_limit: 256
    mem_limit: 6g
    cpus: ${SANDBOX_CPUS:-8}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8200/health')"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  gateway-db:
    # Base `gateway` (clés hachées, usage par utilisateur) dans le Postgres de MLflow, créée si absente.
    image: postgres:16
    profiles: [gpu, ci]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-mlflow}
    command:
      - sh
      - -c
      - >
        psql -h postgres -U mlflow -tAc "SELECT 1 FROM pg_database WHERE datname='gateway'" | grep -q 1
        || psql -h postgres -U mlflow -c "CREATE DATABASE gateway"

  gateway:
    <<: *gateway
    profiles: [gpu]
    depends_on:
      mlflow:
        condition: service_healthy
      gateway-db:
        condition: service_completed_successfully
      sandbox:
        condition: service_healthy
      vllm:
        condition: service_started
      explainer:
        condition: service_started
      ocr:
        condition: service_started
    environment:
      <<: *gateway-env
      OCR_URL: http://ocr:8300
      OCR_CAPTURE_DIR: ${GATEWAY_OCR_CAPTURE_DIR:-}   # développement (.env) : /cache/ocr-captures pour garder les photos relues

  gateway-ci:
    # Profil ci : mêmes réglages, le faux LLM répond sous les noms `vllm` et `explainer`
    <<: *gateway
    profiles: [ci]
    depends_on:
      mlflow:
        condition: service_healthy
      gateway-db:
        condition: service_completed_successfully
      sandbox:
        condition: service_healthy
      fake-llm:
        condition: service_started

  # ---- Monitoring (profils gpu et ci) : http://localhost:3000 (Grafana), http://localhost:9090 (Prometheus)

  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    profiles: [gpu, ci]
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0@sha256:6ac590e7cabc2fbe8d7b8fc1ce9c9f0582177b334e0df9c927ebd9670469440f
    profiles: [gpu, ci]
    depends_on: [prometheus, gateway-db]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/photo-maths.json
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlflow}   # lu par la source de données provisionnée
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    restart: unless-stopped

networks:
  sandbox-net:
    internal: true   # aucune sortie vers l'extérieur

volumes:
  pgdata:
  miniodata:
  registry:
  modelcache:
  promdata:
  grafanadata:
